###############################################################################
# HUD — a futuristic sci-fi heads-up-display theme for Home Assistant
#
# Install:
#   1. Copy this file to <config>/themes/hud.yaml
#   2. Add to configuration.yaml:
#        frontend:
#          themes: !include_dir_merge_named themes
#   3. Restart Home Assistant, then pick "HUD" from your profile theme menu.
###############################################################################

HUD:
  # ---- Core palette ---------------------------------------------------------
  # Deep navy void with glowing cyan primaries and amber warnings.
  hud-bg-0: "#04080f" # deepest background
  hud-bg-1: "#07101c" # panels
  hud-bg-2: "#0c1a2c" # raised surfaces
  hud-bg-3: "#122641" # hovered / selected
  hud-grid: "rgba(0, 229, 255, 0.08)"
  hud-cyan: "#00e5ff"
  hud-cyan-soft: "#4dd0e1"
  hud-cyan-glow: "rgba(0, 229, 255, 0.55)"
  hud-accent: "#7cf9ff"
  hud-amber: "#ffb74d"
  hud-red: "#ff3d6e"
  hud-green: "#19f5a0"
  hud-violet: "#b388ff"
  hud-text: "#d7f4ff"
  hud-text-dim: "#7aa3b8"
  hud-text-faint: "#3f5a72"
  hud-line: "rgba(0, 229, 255, 0.35)"
  hud-line-soft: "rgba(0, 229, 255, 0.12)"

  # ---- Primary / accent -----------------------------------------------------
  primary-color: "var(--hud-cyan)"
  dark-primary-color: "#00acc1"
  light-primary-color: "var(--hud-accent)"
  accent-color: "var(--hud-amber)"

  # ---- Text -----------------------------------------------------------------
  primary-text-color: "var(--hud-text)"
  secondary-text-color: "var(--hud-text-dim)"
  text-primary-color: "var(--hud-bg-0)"
  disabled-text-color: "var(--hud-text-faint)"
  app-header-text-color: "var(--hud-cyan)"

  # ---- Backgrounds ----------------------------------------------------------
  primary-background-color: "var(--hud-bg-0)"
  secondary-background-color: "var(--hud-bg-1)"
  card-background-color: "var(--hud-bg-1)"
  ha-card-background: "var(--hud-bg-1)"
  paper-listbox-background-color: "var(--hud-bg-1)"
  paper-card-background-color: "var(--hud-bg-1)"
  sidebar-background-color: "var(--hud-bg-0)"

  # Subtle scan-line / grid overlay on the main lovelace view.
  lovelace-background: >-
    linear-gradient(var(--hud-bg-0), var(--hud-bg-0)),
    repeating-linear-gradient(0deg, var(--hud-grid) 0 1px, transparent 1px 40px),
    repeating-linear-gradient(90deg, var(--hud-grid) 0 1px, transparent 1px 40px)

  # ---- App header / toolbar -------------------------------------------------
  app-header-background-color: "var(--hud-bg-0)"
  app-header-edge-background-color: "var(--hud-bg-0)"
  app-header-selection-bar-color: "var(--hud-cyan)"

  # ---- Sidebar --------------------------------------------------------------
  sidebar-icon-color: "var(--hud-text-dim)"
  sidebar-text-color: "var(--hud-text-dim)"
  sidebar-selected-background-color: "var(--hud-bg-2)"
  sidebar-selected-icon-color: "var(--hud-cyan)"
  sidebar-selected-text-color: "var(--hud-cyan)"

  # ---- Cards ----------------------------------------------------------------
  ha-card-border-radius: "2px"
  ha-card-border-width: "1px"
  ha-card-border-color: "var(--hud-line)"
  ha-card-box-shadow: >-
    0 0 0 1px var(--hud-line-soft),
    0 0 24px -6px var(--hud-cyan-glow),
    inset 0 0 40px -20px var(--hud-cyan-glow)

  # ---- Dividers / outlines --------------------------------------------------
  divider-color: "var(--hud-line-soft)"
  outline-color: "var(--hud-line)"

  # ---- State colors ---------------------------------------------------------
  state-icon-color: "var(--hud-cyan-soft)"
  state-icon-active-color: "var(--hud-cyan)"
  state-icon-unavailable-color: "var(--hud-text-faint)"
  state-on-color: "var(--hud-green)"
  state-off-color: "var(--hud-text-faint)"

  # Per-domain icon colors
  state-binary_sensor-active-color: "var(--hud-cyan)"
  state-light-active-color: "var(--hud-amber)"
  state-media_player-active-color: "var(--hud-violet)"
  state-switch-active-color: "var(--hud-cyan)"
  state-climate-heat-color: "var(--hud-amber)"
  state-climate-cool-color: "var(--hud-cyan)"
  state-alarm_control_panel-armed-color: "var(--hud-red)"

  # ---- Buttons / controls ---------------------------------------------------
  mdc-theme-primary: "var(--hud-cyan)"
  mdc-theme-secondary: "var(--hud-amber)"
  mdc-theme-on-primary: "var(--hud-bg-0)"
  mdc-button-outline-color: "var(--hud-line)"
  mdc-ripple-color: "var(--hud-cyan)"

  paper-item-icon-color: "var(--hud-text-dim)"
  paper-item-icon-active-color: "var(--hud-cyan)"

  # Toggles / switches
  switch-checked-color: "var(--hud-cyan)"
  switch-checked-button-color: "var(--hud-accent)"
  switch-checked-track-color: "var(--hud-cyan)"
  switch-unchecked-button-color: "var(--hud-text-faint)"
  switch-unchecked-track-color: "var(--hud-bg-3)"

  # Sliders
  paper-slider-knob-color: "var(--hud-cyan)"
  paper-slider-knob-start-color: "var(--hud-cyan)"
  paper-slider-pin-color: "var(--hud-cyan)"
  paper-slider-active-color: "var(--hud-cyan)"
  paper-slider-secondary-color: "var(--hud-cyan-soft)"
  paper-slider-container-color: "var(--hud-bg-3)"

  # ---- Material surfaces (menus, popovers, autocompletes, dialogs) ----------
  # Without these, Material components fall back to a white surface and the
  # cyan-tinted text becomes unreadable.
  mdc-theme-surface: "var(--hud-bg-1)"
  mdc-theme-on-surface: "var(--hud-text)"
  mdc-theme-background: "var(--hud-bg-0)"
  mdc-theme-text-primary-on-background: "var(--hud-text)"
  mdc-theme-text-secondary-on-background: "var(--hud-text-dim)"
  mdc-theme-text-primary-on-light: "var(--hud-text)"
  mdc-theme-text-secondary-on-light: "var(--hud-text-dim)"
  mdc-theme-text-primary-on-dark: "var(--hud-text)"
  mdc-theme-text-secondary-on-dark: "var(--hud-text-dim)"

  # Menus / dropdowns / autocomplete
  mdc-menu-surface-fill-color: "var(--hud-bg-2)"
  mdc-list-item-primary-text-color: "var(--hud-text)"
  mdc-list-item-secondary-text-color: "var(--hud-text-dim)"
  paper-listbox-color: "var(--hud-text)"
  paper-menu-background-color: "var(--hud-bg-2)"
  menu-surface-background-color: "var(--hud-bg-2)"

  # Dialogs
  paper-dialog-background-color: "var(--hud-bg-1)"
  paper-dialog-color: "var(--hud-text)"
  mdc-dialog-heading-ink-color: "var(--hud-cyan)"
  mdc-dialog-content-ink-color: "var(--hud-text)"
  mdc-dialog-scrim-color: "rgba(0, 12, 24, 0.82)"

  # ---- Inputs --------------------------------------------------------------
  input-background-color: "var(--hud-bg-2)"
  input-fill-color: "var(--hud-bg-2)"
  input-ink-color: "var(--hud-text)"
  input-label-ink-color: "var(--hud-text-dim)"
  input-disabled-ink-color: "var(--hud-text-faint)"
  input-disabled-fill-color: "var(--hud-bg-1)"
  input-idle-line-color: "var(--hud-line)"
  input-hover-line-color: "var(--hud-cyan)"
  input-outlined-idle-border-color: "var(--hud-line)"
  input-outlined-hover-border-color: "var(--hud-cyan)"
  input-dropdown-icon-color: "var(--hud-text-dim)"
  mdc-text-field-fill-color: "var(--hud-bg-2)"
  mdc-text-field-ink-color: "var(--hud-text)"
  mdc-text-field-label-ink-color: "var(--hud-text-dim)"
  mdc-text-field-idle-line-color: "var(--hud-line)"
  mdc-text-field-hover-line-color: "var(--hud-cyan)"
  mdc-text-field-outlined-idle-border-color: "var(--hud-line)"
  mdc-text-field-outlined-hover-border-color: "var(--hud-cyan)"
  mdc-text-field-disabled-fill-color: "var(--hud-bg-1)"
  mdc-text-field-disabled-ink-color: "var(--hud-text-faint)"
  mdc-select-fill-color: "var(--hud-bg-2)"
  mdc-select-ink-color: "var(--hud-text)"
  mdc-select-label-ink-color: "var(--hud-text-dim)"
  mdc-select-dropdown-icon-color: "var(--hud-text-dim)"
  mdc-select-idle-line-color: "var(--hud-line)"
  mdc-select-hover-line-color: "var(--hud-cyan)"
  mdc-select-outlined-idle-border-color: "var(--hud-line)"
  mdc-select-outlined-hover-border-color: "var(--hud-cyan)"
  mdc-checkbox-unchecked-color: "var(--hud-line)"
  mdc-checkbox-ink-color: "var(--hud-bg-0)"

  # ---- Tables / code -------------------------------------------------------
  table-row-background-color: "var(--hud-bg-1)"
  table-row-alternative-background-color: "var(--hud-bg-2)"
  code-editor-background-color: "var(--hud-bg-0)"
  markdown-code-background-color: "var(--hud-bg-2)"

  # ---- Header / labels (newer HA variables) ---------------------------------
  primary-color-rgb: "0, 229, 255"
  rgb-primary-color: "0, 229, 255"
  rgb-accent-color: "255, 183, 77"
  rgb-primary-text-color: "215, 244, 255"
  rgb-secondary-text-color: "122, 163, 184"
  rgb-state-icon-color: "77, 208, 225"

  # ---- HA design-system semantic tokens (2024+) -----------------------------
  # Newer components (headings, tile/area cards, menus, more-info) read these
  # tokens instead of the legacy vars. In HA's light mode they default to
  # dark-on-light, so force them onto the HUD palette.
  ha-card-header-color: "var(--hud-text)"
  ha-color-text-primary: "var(--hud-text)"
  ha-color-text-secondary: "var(--hud-text-dim)"
  ha-color-text-disabled: "var(--hud-text-faint)"
  ha-color-text-link: "var(--hud-cyan)"
  ha-color-focus: "var(--hud-line)"

  # Text that sits on HUD surfaces
  ha-color-on-surface-default: "var(--hud-text)"
  ha-color-on-neutral-quiet: "var(--hud-text-dim)"
  ha-color-on-neutral-normal: "var(--hud-text)"
  ha-color-on-neutral-loud: "var(--hud-bg-0)"

  # Surfaces / forms / dropdown and input backgrounds
  ha-color-surface-default: "var(--hud-bg-0)"
  ha-color-surface-low: "var(--hud-bg-1)"
  ha-color-surface-lower: "var(--hud-bg-2)"
  ha-dialog-surface-background: "var(--hud-bg-2)"
  ha-color-form-background: "var(--hud-bg-2)"
  ha-color-form-background-hover: "var(--hud-bg-3)"
  ha-color-form-background-disabled: "var(--hud-bg-1)"

  # Neutral borders / fills used by newer components
  ha-color-border-neutral-quiet: "var(--hud-line-soft)"
  ha-color-border-neutral-normal: "var(--hud-line)"
  ha-color-border-neutral-loud: "var(--hud-cyan)"
  ha-color-fill-neutral-quiet-resting: "var(--hud-bg-2)"
  ha-color-fill-neutral-quiet-hover: "var(--hud-bg-3)"
  ha-color-fill-neutral-quiet-active: "var(--hud-bg-2)"
  ha-color-fill-neutral-normal-resting: "var(--hud-bg-3)"
  ha-color-fill-neutral-normal-hover: "var(--hud-bg-2)"
  ha-color-fill-neutral-normal-active: "var(--hud-bg-3)"
  ha-color-fill-neutral-loud-resting: "var(--hud-cyan)"
  ha-color-fill-neutral-loud-hover: "var(--hud-cyan-soft)"
  ha-color-fill-neutral-loud-active: "var(--hud-cyan)"
  ha-color-fill-disabled-quiet-resting: "var(--hud-bg-1)"
  ha-color-fill-disabled-normal-resting: "var(--hud-bg-1)"

  # Web Awesome form controls (newer inputs): kill the white fallbacks
  wa-color-surface-raised: "var(--hud-bg-2)"
  wa-color-surface-default: "var(--hud-bg-0)"
  wa-form-control-background-color: "var(--hud-bg-2)"

  # ---- Chips / badges -------------------------------------------------------
  label-badge-background-color: "var(--hud-bg-2)"
  label-badge-border-color: "var(--hud-line)"
  label-badge-text-color: "var(--hud-cyan)"
  label-badge-red: "var(--hud-red)"
  label-badge-green: "var(--hud-green)"
  label-badge-blue: "var(--hud-cyan)"
  label-badge-yellow: "var(--hud-amber)"
  label-badge-grey: "var(--hud-text-faint)"

  # ---- Typography -----------------------------------------------------------
  # Swap in a techy monospace-leaning stack. If you have Orbitron/Rajdhani
  # installed via a frontend extra_module_url, they'll take priority.
  primary-font-family: >-
    "Orbitron", "Rajdhani", "Share Tech Mono",
    "JetBrains Mono", "Fira Code", ui-monospace, monospace
  # Headlines lean harder on Orbitron for that sci-fi display type look,
  # falling back to the same stack as body text.
  headline-font-family: >-
    "Orbitron", "Rajdhani", "Share Tech Mono",
    "JetBrains Mono", "Fira Code", ui-monospace, monospace
  paper-font-common-base_-_font-family: "var(--primary-font-family)"
  paper-font-common-code_-_font-family: "var(--primary-font-family)"
  paper-font-body1_-_font-family: "var(--primary-font-family)"
  paper-font-subhead_-_font-family: "var(--primary-font-family)"
  paper-font-headline_-_font-family: "var(--headline-font-family)"
  paper-font-title_-_font-family: "var(--headline-font-family)"
  paper-font-display1_-_font-family: "var(--headline-font-family)"
  paper-font-display2_-_font-family: "var(--headline-font-family)"
  paper-font-display3_-_font-family: "var(--headline-font-family)"
  paper-font-display4_-_font-family: "var(--headline-font-family)"
  ha-card-header-font-family: "var(--headline-font-family)"
  ha-font-family-heading: "var(--headline-font-family)"

  # Big entity values get a subtle neon glow.
  ha-heading-card-title-font-size: "1.2em"
  ha-heading-card-title-color: "var(--hud-cyan)"

  # Custom card-mod / card-specific helpers --------------------------------
  # Many community cards read these, so expose extras for consistency.
  card-mod-theme: "HUD"

  # Requires the "card-mod" custom component (HACS). Applies Orbitron to
  # headlines that HA's font tokens don't reach: plain h1 elements (markdown
  # cards, etc.) and commonly used content-title divs.
  card-mod-root-yaml: |
    .: |
      h1,
      div.content.title,
      div.content .title,
      .content-title {
        font-family: var(--headline-font-family);
      }

  mush-rgb-primary: "0, 229, 255"
  mush-rgb-accent: "255, 183, 77"
  mush-rgb-red: "255, 61, 110"
  mush-rgb-green: "25, 245, 160"
  mush-rgb-amber: "255, 183, 77"
  mush-rgb-disabled: "63, 90, 114"

  # The flat vars above apply to both modes (this theme forces its own
  # dark palette). Declaring modes also makes the Dark mode selector appear
  # in the user profile while this theme is active.
  modes:
    light: {}
    dark: {}
